name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - run: APP_VERSION="${VERSION#v}" ./scripts/bundle.sh
      - run: ditto -c -k --keepParent dist/Myco.app "Myco-${VERSION#v}.zip"
      - run: gh release create "$VERSION" "Myco-${VERSION#v}.zip" --generate-notes
